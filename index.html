<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voicing Lab</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header>
  <h1>Voicing Lab</h1>
  <nav class="tabs" role="tablist">
    <button id="tab-drill" type="button" role="tab" aria-selected="true">Drill</button>
    <button id="tab-progression" type="button" role="tab" aria-selected="false">Progression</button>
  </nav>
  <p id="status">Requesting MIDI access…</p>
  <p id="stats" class="stats">Session: no chords yet</p>
</header>

<main>
  <section class="drill">
    <div id="chord" class="chord">—</div>
    <span class="actions">
      <button id="ask" type="button">Ask Claude <kbd>A</kbd></button>
      <button id="suggest" type="button">Play suggestion <kbd>P</kbd></button>
      <button id="next" type="button">Next <kbd>Space</kbd></button>
    </span>
  </section>

  <section id="progression-panel" class="progression" hidden>
    <div class="row">
      <label>Progression
        <select id="prog-library"></select>
      </label>
      <label>Key
        <select id="prog-key"></select>
      </label>
      <label>Time
        <select id="prog-time">
          <option value="4/4">4/4</option>
          <option value="3/4">3/4</option>
        </select>
      </label>
      <label>Tempo
        <input id="prog-tempo" type="number" min="40" max="300" step="2" value="120">
      </label>
      <label class="check"><input id="prog-loop" type="checkbox" checked> loop</label>
    </div>
    <textarea id="prog-grid" rows="2" spellcheck="false" placeholder="| Dm7 G7 | Cmaj7 | % |"></textarea>
    <div class="row">
      <span class="modes">
        <label class="check"><input type="radio" name="prog-mode" value="free" checked> free (Space / E1 moves on)</label>
        <label class="check"><input type="radio" name="prog-mode" value="timed"> timed (metronome)</label>
      </span>
      <button id="prog-start" type="button">Start</button>
      <button id="prog-stop" type="button" disabled>Stop</button>
    </div>
    <div id="grid-view" class="grid-view"></div>
    <div id="summary" class="summary"></div>
    <div class="row piece-row">
      <button id="rec-start" type="button">Record melody</button>
      <button id="rec-stop" type="button" disabled>Stop recording</button>
      <span class="spacer"></span>
      <button id="piece-save" type="button" disabled>Save</button>
      <select id="piece-list" aria-label="Saved pieces"></select>
      <button id="piece-load" type="button">Load</button>
      <button id="piece-delete" type="button">Delete</button>
      <button id="piece-export" type="button" disabled>Export JSON</button>
      <label class="file-button">Import JSON <input id="piece-import" type="file" accept=".json,application/json"></label>
    </div>
    <div id="melody-view" class="melody-view"></div>
  </section>

  <svg id="keyboard" class="keyboard" role="img" aria-label="Keyboard"></svg>

  <section id="feedback" class="feedback" aria-live="polite"></section>

  <details class="settings">
    <summary>Settings</summary>
    <div id="settings-body"></div>
  </details>
</main>

<footer>
  <small>Play the chord on your MIDI keyboard. Space or the lowest key (E1) moves on. <a href="./midi-test.html">MIDI test</a></small>
</footer>

<script type="module" src="./src/app.js"></script>
</body>
</html>
