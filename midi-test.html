<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI test — Voicing Lab</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 2rem 1.5rem; max-width: 46rem;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p  { margin: .25rem 0 1rem; }
  section { margin-top: 1.75rem; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  ul { margin: 0; padding-left: 1.25rem; }
  #held {
    font-size: 2.2rem; font-weight: 600; min-height: 3.5rem;
    letter-spacing: .02em;
  }
  #held small { font-size: 1rem; font-weight: 400; opacity: .6; }
  #log {
    height: 12rem; overflow-y: auto; padding: .5rem .75rem;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    border-radius: 6px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem;
  }
  #log div { white-space: pre; }
  button, select {
    font: inherit; padding: .4rem .8rem; border-radius: 6px;
    border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
    background: transparent; color: inherit; cursor: pointer;
  }
  button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  .warn { color: #b3541e; }
</style>
</head>
<body>

<h1>MIDI test</h1>
<p id="status">Requesting MIDI access…</p>

<section>
  <h2>Inputs (Genos should appear here)</h2>
  <ul id="inputs"><li>none yet</li></ul>
</section>

<section>
  <h2>Held notes — play something</h2>
  <div id="held"><small>waiting for notes</small></div>
</section>

<section>
  <h2>Output — send a chord to Genos</h2>
  <div class="row">
    <select id="outputs"></select>
    <button id="send">Send test chord (Cmaj9)</button>
    <span id="sendStatus"></span>
  </div>
  <p><small>If you hear nothing: check which MIDI channel Genos maps to a voice. Change the channel in the code (CHANNEL) and reload.</small></p>
</section>

<section>
  <h2>Event log</h2>
  <div id="log"></div>
</section>

<script>
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CHANNEL = 1;                 // 1–16; change if Genos plays nothing
const TEST_CHORD = [48, 55, 59, 64, 67, 74]; // C3 G3 B3 E4 G4 D5 — a Cmaj9 spread (MIDI 60 = C4)

const held = new Set();
const $ = id => document.getElementById(id);

function noteName(n) { return NAMES[n % 12] + (Math.floor(n / 12) - 1); }

function log(text) {
  const el = $('log');
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString() + '  ' + text;
  el.prepend(line);
  while (el.children.length > 200) el.lastChild.remove();
}

function renderHeld() {
  const notes = [...held].sort((a, b) => a - b);
  $('held').innerHTML = notes.length
    ? notes.map(n => `${noteName(n)} <small>${n}</small>`).join('&nbsp; ')
    : '<small>waiting for notes</small>';
}

function onMessage(e) {
  const [status, data1, data2] = e.data;
  const type = status & 0xf0;
  const ch = (status & 0x0f) + 1;
  if (type === 0x90 && data2 > 0) {
    held.add(data1);
    log(`note on   ch${ch}  ${noteName(data1).padEnd(4)} (${data1})  vel ${data2}`);
  } else if (type === 0x80 || (type === 0x90 && data2 === 0)) {
    held.delete(data1);
    log(`note off  ch${ch}  ${noteName(data1).padEnd(4)} (${data1})`);
  } else if (type === 0xb0) {
    log(`cc ${data1} = ${data2}  ch${ch}`);
  }
  renderHeld();
}

function refreshDevices(midi) {
  const ins = [...midi.inputs.values()];
  const outs = [...midi.outputs.values()];

  $('inputs').innerHTML = ins.length
    ? ins.map(i => `<li>${i.name} <small>(${i.manufacturer || 'unknown'}, ${i.state})</small></li>`).join('')
    : '<li class="warn">No MIDI inputs found. Check USB cable, Yamaha USB-MIDI driver, and reload.</li>';

  ins.forEach(i => { i.onmidimessage = onMessage; });

  $('outputs').innerHTML = outs.length
    ? outs.map(o => `<option value="${o.id}">${o.name}</option>`).join('')
    : '<option value="">no outputs found</option>';

  $('status').textContent = `MIDI access granted — ${ins.length} input(s), ${outs.length} output(s).`;
}

async function init() {
  if (!navigator.requestMIDIAccess) {
    $('status').innerHTML = '<span class="warn">Web MIDI is not available in this browser. Use Chrome or Edge.</span>';
    return;
  }
  try {
    const midi = await navigator.requestMIDIAccess();
    refreshDevices(midi);
    midi.onstatechange = () => { log('device list changed'); refreshDevices(midi); };

    $('send').onclick = () => {
      const out = midi.outputs.get($('outputs').value);
      if (!out) { $('sendStatus').textContent = 'no output selected'; return; }
      const on = 0x90 | (CHANNEL - 1), off = 0x80 | (CHANNEL - 1);
      TEST_CHORD.forEach(n => out.send([on, n, 90]));
      setTimeout(() => TEST_CHORD.forEach(n => out.send([off, n, 0])), 1500);
      $('sendStatus').textContent = `sent on channel ${CHANNEL}`;
      log(`sent test chord to "${out.name}" on ch${CHANNEL}`);
    };
  } catch (err) {
    $('status').innerHTML = `<span class="warn">MIDI access refused: ${err.message}. Allow MIDI in the site permissions and reload.</span>`;
  }
}

init();
</script>
</body>
</html>
